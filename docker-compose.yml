version: '3.8'

services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - elevator-network

  api-gateway:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - elevator-network

  agent-1:
    build: .
    command: python agents/elevator_agent.py 1
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - elevator-network
    restart: on-failure

  agent-2:
    build: .
    command: python agents/elevator_agent.py 2
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - elevator-network
    restart: on-failure

  agent-3:
    build: .
    command: python agents/elevator_agent.py 3
    environment:
      - REDIS_HOST=redis
    depends_on:
      - redis
    networks:
      - elevator-network
    restart: on-failure

networks:
  elevator-network:
    driver: bridge
